# Publishes the Artifact Hub repository metadata to the registry.
#
# The Verified Publisher badge comes from an artifact stored under the reserved
# `artifacthub.io` tag beside the chart. It is not part of a chart release: it
# changes when the metadata changes, which is close to never, so it gets its own
# workflow rather than another step nobody reads in the release one.
#
# It runs here rather than from a workstation because pushing needs a
# package-write credential, and the only one that should exist is the job-scoped
# token Actions issues and revokes.
#
# Artifact Hub applies the flag on its next scan of the repository, not
# immediately, so the badge appears some time after this succeeds.
name: Artifact Hub metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artifacthub-repo.yml"
      - ".github/workflows/fork-artifacthub-metadata.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish repository metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install oras
        env:
          ORAS_VERSION: "1.3.3"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin oras
          oras version

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The two media types are Artifact Hub's, not ours, and it ignores the
      # artifact if either is wrong. The config is empty on purpose: the layer
      # carries everything.
      - name: Push metadata artifact
        run: |
          set -euo pipefail
          oras push \
            ghcr.io/madduck-tech/charts/loomwatch:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Read it back
        run: |
          set -euo pipefail
          oras manifest fetch --pretty ghcr.io/madduck-tech/charts/loomwatch:artifacthub.io
