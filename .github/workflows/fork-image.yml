# Container image for this fork.
#
# The upstream release workflow also builds macOS menubar binaries and an
# Alpine shell variant. We need neither: the cluster runs the distroless
# variant on linux/amd64 only, and macOS runners are the expensive part of
# that workflow. Keeping a separate, smaller workflow means syncing the fork
# with upstream never has to resolve a conflict in the release pipeline.
#
# Tags are prefixed `fork-v` so they never collide with upstream release tags
# pulled in by a sync.
name: Fork image

on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (branch, tag or SHA)"
        required: true
        default: main

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    name: Build and push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # The long SHA tag is what deployments pin. A moving tag would let
          # the running image change without a diff in the infrastructure repo.
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
