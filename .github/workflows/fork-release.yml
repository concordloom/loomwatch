# Release: container image + GitHub Release.
#
# Deliberately a separate file rather than an edit to the upstream release
# pipeline, which is left untouched so that syncing with upstream never has to
# resolve a conflict here. Upstream's workflow is dispatch-only, so the two do
# not compete for the same trigger.
#
# It is not reused because it builds macOS menubar binaries and an Alpine shell
# variant that this deployment has no use for, and macOS runners are the
# expensive part of it.
#
# Versioning: this fork has its own version line, recorded in VERSION, with the
# upstream base it was cut from recorded separately in UPSTREAM_VERSION. A
# derived scheme such as `2.13.3-loom.1` was rejected: under SemVer a hyphen
# suffix denotes a PRE-release, so it sorts BELOW 2.13.3, and anything that
# compares versions - including this project's own updater - would read the
# fork as older than the release it is built on.
#
# Tag prefix `loom-v` is not decoration. A fork inherits the upstream tag
# namespace wholesale - this repository carries 90 upstream tags, `v1.0.0`
# among them (upstream's, from 2026-02-07). So `v*` is both occupied and
# unsafe: an upstream tag arriving via a sync would trigger this workflow and
# publish an image built from upstream code under our version line. The prefix
# makes that impossible mechanically instead of by discipline.
#
# The prefix is the git label only. The version itself stays plain: VERSION,
# the image tags and onwatch_build_info all read 1.0.0.
name: Fork release

on:
  push:
    tags:
      - "loom-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build (must already exist)"
        required: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build, push and release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Catches the common human error of tagging without bumping VERSION.
      # The binary embeds VERSION (see main.go), so a mismatch would ship an
      # image whose tag and self-reported version disagree - and the updater
      # compares the embedded value against the latest release tag, so it would
      # then report an update against itself forever.
      - name: Verify VERSION matches the tag
        run: |
          tag="${{ inputs.ref || github.ref_name }}"
          want="${tag#loom-v}"
          got="$(cat VERSION)"
          if [ "$want" != "$got" ]; then
            echo "tag $tag implies version '$want' but VERSION says '$got'"
            exit 1
          fi
          echo "version=$got" >> "$GITHUB_OUTPUT"
        id: version

      - name: Read upstream base version
        id: upstream
        run: echo "version=$(cat UPSTREAM_VERSION)" >> "$GITHUB_OUTPUT"

      # The chart is versioned in lockstep with the application it ships, so a
      # drift between the two would publish a chart whose number says nothing
      # about which build it installs.
      - name: Verify chart version matches
        run: |
          want="${{ steps.version.outputs.version }}"
          got="$(awk '/^version:/ {print $2; exit}' charts/loomwatch/Chart.yaml)"
          app="$(awk '/^appVersion:/ {print $2; exit}' charts/loomwatch/Chart.yaml)"
          if [ "$want" != "$got" ] || [ "$want" != "$app" ]; then
            echo "VERSION says '$want' but Chart.yaml has version='$got' appVersion='$app'"
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Publishing an untested chart is worse than publishing none: it looks
      # supported. These are the same checks run locally.
      - name: Lint and test the chart
        run: |
          helm lint charts/loomwatch
          # --verify=false is required from Helm 4 on: the plugin source
          # publishes no provenance, and without the flag the install aborts.
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version 1.0.3 --verify=false
          helm unittest charts/loomwatch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # No `latest`, deliberately: deployments pin an immutable reference,
          # and a moving tag lets the running version change with no diff in
          # the infrastructure repo that declares it.
          #
          # latest=false is required, not decorative. metadata-action defaults
          # to latest=auto, which publishes `latest` on any semver tag - it did
          # exactly that on the 1.0.0 release before this line existed.
          flavor: |
            latest=false
          # value= is required: the git tag is `loom-v1.0.0`, which is not
          # parseable as SemVer, so the version is fed in from VERSION instead
          # of being derived from the ref.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=loomwatch
            org.opencontainers.image.description=LLM subscription quota tracker (fork of onllm-dev/onWatch)
            dev.concordloom.upstream.repository=onllm-dev/onWatch
            dev.concordloom.upstream.version=${{ steps.upstream.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      # Charts go to the same registry as the image, as an OCI artifact. No
      # separate index, no GitHub Pages, nothing extra to keep alive: the chart
      # is fetched with `helm install oci://...` directly.
      - name: Package and push the Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/loomwatch --destination dist
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/loomwatch-${{ steps.version.outputs.version }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          {
            echo "Fork of [onllm-dev/onWatch](https://github.com/onllm-dev/onWatch),"
            echo "based on upstream **${{ steps.upstream.outputs.version }}**."
            echo
            echo "Container image:"
            echo '```'
            echo "ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"
            echo '```'
            echo
            echo "Helm chart:"
            echo '```'
            echo "helm install loomwatch oci://ghcr.io/${{ github.repository_owner }}/charts/loomwatch --version ${{ steps.version.outputs.version }}"
            echo '```'
            echo
            echo "Self-update inside a container is unsupported: the unit of"
            echo "delivery is the image."
            echo
          } > notes.md
          gh release create "$TAG" \
            --title "loomwatch ${{ steps.version.outputs.version }}" \
            --notes-file notes.md --generate-notes
