annotations:
  category: Monitoring
  licenses: GPL-3.0-only
  images: |
    - name: loomwatch
      image: ghcr.io/concordloom/loomwatch:1.0.4
apiVersion: v2
appVersion: 1.7.0
description: LLM subscription quota tracker with a Prometheus-first interface. Exports remaining quota per provider and account so exhaustion can be alerted on before it stops your workloads.
home: https://github.com/concordloom/loomwatch
icon: https://raw.githubusercontent.com/concordloom/loomwatch/main/charts/loomwatch/logo.png
keywords:
  - monitoring
  - observability
  - prometheus
  - grafana
  - llm
  - quota
  - minimax
  - zai
maintainers:
  - name: concordloom
    url: https://github.com/concordloom
name: loomwatch
sources:
  - https://github.com/concordloom/loomwatch
type: application
# Kept equal to appVersion on purpose. The chart ships this application from
# the same repository and is released with it, so two independent numbers would
# only raise the question "which chart version carries that fix". The release
# workflow refuses to publish when the two disagree.
version: 1.7.0
