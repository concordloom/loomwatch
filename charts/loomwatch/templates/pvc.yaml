{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "loomwatch.pvcName" . }}
  namespace: {{ include "loomwatch.namespace" . | quote }}
  labels: {{- include "loomwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
    {{- if .Values.persistence.labels }}
    {{- include "loomwatch.tplvalues.render" (dict "value" .Values.persistence.labels "context" $) | nindent 4 }}
    {{- end }}
  {{- if or .Values.persistence.annotations .Values.commonAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- include "loomwatch.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
    {{- end }}
    {{- if .Values.persistence.annotations }}
    {{- include "loomwatch.tplvalues.render" (dict "value" .Values.persistence.annotations "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    {{- range .Values.persistence.accessModes }}
    - {{ . | quote }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- include "loomwatch.storageClass" . | nindent 2 }}
  {{- if .Values.persistence.selector }}
  selector: {{- include "loomwatch.tplvalues.render" (dict "value" .Values.persistence.selector "context" $) | nindent 4 }}
  {{- end }}
  {{- if .Values.persistence.dataSource }}
  dataSource: {{- include "loomwatch.tplvalues.render" (dict "value" .Values.persistence.dataSource "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
