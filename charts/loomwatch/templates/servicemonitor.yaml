{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "loomwatch.fullname" . }}
  namespace: {{ default (include "loomwatch.namespace" .) .Values.metrics.serviceMonitor.namespace | quote }}
  labels: {{- include "loomwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    {{- if .Values.metrics.serviceMonitor.labels }}
    {{- include "loomwatch.tplvalues.render" (dict "value" .Values.metrics.serviceMonitor.labels "context" $) | nindent 4 }}
    {{- end }}
  {{- if or .Values.metrics.serviceMonitor.annotations .Values.commonAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- include "loomwatch.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
    {{- end }}
    {{- if .Values.metrics.serviceMonitor.annotations }}
    {{- include "loomwatch.tplvalues.render" (dict "value" .Values.metrics.serviceMonitor.annotations "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.metrics.serviceMonitor.jobLabel }}
  jobLabel: {{ .Values.metrics.serviceMonitor.jobLabel | quote }}
  {{- end }}
  selector:
    matchLabels: {{- include "loomwatch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
    {{- if .Values.metrics.serviceMonitor.selector }}
    {{- include "loomwatch.tplvalues.render" (dict "value" .Values.metrics.serviceMonitor.selector "context" $) | nindent 6 }}
    {{- end }}
  namespaceSelector:
    matchNames:
      - {{ include "loomwatch.namespace" . | quote }}
  endpoints:
    - port: http
      path: /metrics
      {{- if .Values.metrics.enabled }}
      {{/*
        The token is referenced from the Secret rather than inlined: a scrape
        config is readable by anyone who can read ServiceMonitors, which is a
        wider set than those who can read Secrets.
      */}}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "loomwatch.secretName" . }}
          key: {{ .Values.auth.secretKeys.metricsTokenKey }}
      {{- end }}
      {{- if .Values.metrics.serviceMonitor.interval }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- end }}
      {{- if .Values.metrics.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- end }}
      {{- if .Values.metrics.serviceMonitor.honorLabels }}
      honorLabels: {{ .Values.metrics.serviceMonitor.honorLabels }}
      {{- end }}
      {{- if .Values.metrics.serviceMonitor.relabelings }}
      relabelings: {{- include "loomwatch.tplvalues.render" (dict "value" .Values.metrics.serviceMonitor.relabelings "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings: {{- include "loomwatch.tplvalues.render" (dict "value" .Values.metrics.serviceMonitor.metricRelabelings "context" $) | nindent 8 }}
      {{- end }}
{{- end }}
