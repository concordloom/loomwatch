# Semantics of the account-to-team mapping, checked against a real PromQL
# engine rather than against rendered text.
#
# Two things here are the whole point of the file:
#   - two providers both reporting account_id "default" must not collide;
#   - an account absent from the mapping must appear as "unassigned", not
#     disappear. A per-team query that silently loses an account is the failure
#     this feature would otherwise introduce.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      # Mapped, numeric account id.
      - series: 'loomwatch_agent_healthy{provider="zai",account_id="1"}'
        values: "1x5"
      - series: 'loomwatch_quota_utilization_percent{provider="zai",quota_type="tokens",account_id="1"}'
        values: "92x5"
      # Mapped, single-account provider reporting "default".
      - series: 'loomwatch_agent_healthy{provider="anthropic",account_id="default"}'
        values: "1x5"
      - series: 'loomwatch_quota_utilization_percent{provider="anthropic",quota_type="tokens",account_id="default"}'
        values: "40x5"
      # NOT mapped, and also reporting "default" - the collision case.
      - series: 'loomwatch_agent_healthy{provider="gemini",account_id="default"}'
        values: "1x5"
      - series: 'loomwatch_quota_utilization_percent{provider="gemini",quota_type="tokens",account_id="default"}'
        values: "77x5"
    promql_expr_test:
      # Every reporting account carries a team; the unmapped one is visible.
      - expr: loomwatch:account_team
        eval_time: 3m
        exp_samples:
          - labels: 'loomwatch:account_team{account_id="default",provider="anthropic",team="research"}'
            value: 1
          - labels: 'loomwatch:account_team{account_id="default",provider="gemini",team="unassigned"}'
            value: 1
          - labels: 'loomwatch:account_team{account_id="1",provider="zai",team="platform"}'
            value: 1

      # The documented join. Three series in, three series out: joining must not
      # drop an account, and two "default" accounts must not abort the query.
      - expr: >-
          max by (provider, quota_type, account_id, team) (
            loomwatch_quota_utilization_percent
            * on (provider, account_id) group_left(team) loomwatch:account_team
          )
        eval_time: 3m
        exp_samples:
          - labels: '{account_id="default",provider="anthropic",quota_type="tokens",team="research"}'
            value: 40
          - labels: '{account_id="default",provider="gemini",quota_type="tokens",team="unassigned"}'
            value: 77
          - labels: '{account_id="1",provider="zai",quota_type="tokens",team="platform"}'
            value: 92

      # The inverse control that LoomwatchAccountWithoutTeam fires on.
      - expr: 'loomwatch:account_team{team="unassigned"}'
        eval_time: 3m
        exp_samples:
          - labels: 'loomwatch:account_team{account_id="default",provider="gemini",team="unassigned"}'
            value: 1
