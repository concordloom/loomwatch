<!--
  The loomWatch mark: warp threads of differing length are the subscriptions,
  the cross thread is the limit. One thread has gone past the limit and is
  coloured separately: that is exactly the state people look at the dashboard
  for.

  On the tile the accent is lighter than the peach used in the interface
  (#F59E0B): against a teal background the peach almost blends in, and in a
  browser tab the mark lives at 16 pixels.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="loomWatch">
  <rect width="32" height="32" rx="8" fill="#0D9488"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.9" stroke-linecap="round">
    <path d="M7 25.6V19.2"/>
    <path d="M12.8 25.6V14.1"/>
    <path d="M24.3 25.6V21.8"/>
  </g>
  <path d="M18.6 25.6V9" fill="none" stroke="#FDE68A" stroke-width="2.9" stroke-linecap="round"/>
  <path d="M4.4 16.6h23.2" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round"/>
</svg>
